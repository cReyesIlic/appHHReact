name: Deploy backend → apphhshimin

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  RG: appHH
  APP_SERVICE: apphhshimin
  ACR_NAME: apphshimin
  IMAGE_NAME: shimin-backend
  WORKDIR: backend
  SMOKE_TEST_CODIGO: O-0274
  SMOKE_TEST_MIN_FILAS: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # para login OIDC (opcional)

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker build & push
        run: |
          az acr login --name $ACR_NAME
          IMAGE_URI=$ACR_NAME.azurecr.io/$IMAGE_NAME
          docker build \
            -t $IMAGE_URI:${{ steps.tag.outputs.tag }} \
            -t $IMAGE_URI:latest \
            -f $WORKDIR/Dockerfile \
            $WORKDIR
          docker push $IMAGE_URI:${{ steps.tag.outputs.tag }}
          docker push $IMAGE_URI:latest

      - name: Update web app to new image
        run: |
          az webapp config container set \
            -g $RG -n $APP_SERVICE \
            --docker-custom-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.tag.outputs.tag }} \
            --docker-registry-server-url https://$ACR_NAME.azurecr.io

      - name: Restart web app
        run: az webapp restart -g $RG -n $APP_SERVICE

      - name: Health check
        run: |
          set -e
          HOST=$(az webapp show -g $RG -n $APP_SERVICE --query defaultHostName -o tsv)
          URL="https://$HOST/api/config/status"
          echo "Waiting for $URL ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "  attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed after 30 attempts" >&2
          exit 1

      - name: Smoke test extract-budget end-to-end
        run: |
          set -eo pipefail
          HOST=$(az webapp show -g $RG -n $APP_SERVICE --query defaultHostName -o tsv)
          BACKEND="https://$HOST"
          CODIGO="${SMOKE_TEST_CODIGO}"
          echo "POST $BACKEND/api/entregables/extract-budget/$CODIGO (idempotente)"
          response=$(curl -sS -X POST --max-time 540 "$BACKEND/api/entregables/extract-budget/$CODIGO" -H 'Content-Type: application/json')
          echo "$response" | python -m json.tool 2>/dev/null | head -80 || echo "$response" | head -800
          if echo "$response" | grep -qiE '"detail":\s*"[^"]'; then
            echo "::error::Extract returned an error detail"
            exit 1
          fi

          echo ""
          echo "GET $BACKEND/api/entregables/extracted/$CODIGO"
          extracted=$(curl -sS --max-time 60 "$BACKEND/api/entregables/extracted/$CODIGO")
          n_filas=$(echo "$extracted" | python -c "import json,sys; print(len(json.load(sys.stdin).get('filas') or []))")
          n_gastos=$(echo "$extracted" | python -c "import json,sys; print(len(json.load(sys.stdin).get('gastos') or []))")
          n_audit=$(echo "$extracted" | python -c "import json,sys; print(len(json.load(sys.stdin).get('audit') or []))")
          echo "Persisted: $n_filas filas, $n_gastos gastos, $n_audit audit"
          if [ "$n_filas" -lt "$SMOKE_TEST_MIN_FILAS" ]; then
            echo "::error::Expected at least $SMOKE_TEST_MIN_FILAS filas but got $n_filas"
            exit 1
          fi
          echo "::notice::Smoke test passed for $CODIGO ($n_filas filas + $n_gastos gastos)"

      - name: Azure logout
        if: always()
        run: az logout
