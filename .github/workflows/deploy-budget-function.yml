name: Deploy Function → apphh-budget-extractor

on:
  push:
    branches: [main]
    paths:
      - "budget-extractor-function/**"
      - ".github/workflows/deploy-budget-function.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: apphh-budget-extractor
  PYTHON_VERSION: "3.11"
  WORKDIR: budget-extractor-function

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.WORKDIR }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Health check
        run: |
          set -e
          URL="https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health"
          echo "Waiting for $URL ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "  attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check failed" >&2
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
