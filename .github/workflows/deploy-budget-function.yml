name: Deploy Function → apphh-budget-extractor

on:
  push:
    branches: [main]
    paths:
      - "budget-extractor-function/**"
      - ".github/workflows/deploy-budget-function.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: apphh-budget-extractor
  PYTHON_VERSION: "3.11"
  WORKDIR: budget-extractor-function
  BACKEND_RG: appHH
  BACKEND_APP_SERVICE: apphhshimin
  SMOKE_TEST_CODIGO: O-0274
  SMOKE_TEST_MIN_FILAS: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.WORKDIR }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Health check
        run: |
          set -e
          URL="https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health"
          echo "Waiting for $URL ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "  attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check failed" >&2
          exit 1

      - name: Smoke test extract-budget end-to-end
        run: |
          set -eo pipefail
          HOST=$(az webapp show -g $BACKEND_RG -n $BACKEND_APP_SERVICE --query defaultHostName -o tsv)
          BACKEND="https://$HOST"
          CODIGO="${SMOKE_TEST_CODIGO}"
          echo "POST $BACKEND/api/entregables/extract-budget/$CODIGO (idempotente; dispara la Function recién deployada)"
          response=$(curl -sS -X POST --max-time 540 "$BACKEND/api/entregables/extract-budget/$CODIGO" -H 'Content-Type: application/json')
          echo "$response" | python -m json.tool 2>/dev/null | head -80 || echo "$response" | head -800
          if echo "$response" | grep -qiE '"detail":\s*"[^"]'; then
            echo "::error::Extract returned an error detail"
            exit 1
          fi

          echo ""
          echo "GET $BACKEND/api/entregables/extracted/$CODIGO"
          extracted=$(curl -sS --max-time 60 "$BACKEND/api/entregables/extracted/$CODIGO")
          n_filas=$(echo "$extracted" | python -c "import json,sys; print(len(json.load(sys.stdin).get('filas') or []))")
          n_gastos=$(echo "$extracted" | python -c "import json,sys; print(len(json.load(sys.stdin).get('gastos') or []))")
          n_audit=$(echo "$extracted" | python -c "import json,sys; print(len(json.load(sys.stdin).get('audit') or []))")
          echo "Persisted: $n_filas filas, $n_gastos gastos, $n_audit audit"
          if [ "$n_filas" -lt "$SMOKE_TEST_MIN_FILAS" ]; then
            echo "::error::Expected at least $SMOKE_TEST_MIN_FILAS filas but got $n_filas"
            exit 1
          fi
          echo "::notice::Smoke test passed for $CODIGO ($n_filas filas + $n_gastos gastos)"

      - name: Azure logout
        if: always()
        run: az logout
