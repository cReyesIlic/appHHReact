server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no-archivo cae a index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy del frontend al backend dentro de la red de compose
    location /api/ {
        proxy_pass http://backend:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cache largo para assets versionados
    location ~* \.(?:js|css|svg|woff2?|ttf|ico|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
