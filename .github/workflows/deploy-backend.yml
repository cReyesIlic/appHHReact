name: Deploy backend → apphhshimin

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  RG: appHH
  APP_SERVICE: apphhshimin
  ACR_NAME: apphshimin
  DOCINTEL_ACCOUNT: docIntelhhSHIMIN
  IMAGE_NAME: shimin-backend
  WORKDIR: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # para login OIDC (opcional)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend reliability tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend/tests -v

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker build & push
        run: |
          az acr login --name $ACR_NAME
          IMAGE_URI=$ACR_NAME.azurecr.io/$IMAGE_NAME
          docker build \
            --build-arg APP_VERSION=${{ steps.tag.outputs.tag }} \
            -t $IMAGE_URI:${{ steps.tag.outputs.tag }} \
            -t $IMAGE_URI:latest \
            -f $WORKDIR/Dockerfile \
            $WORKDIR
          docker push $IMAGE_URI:${{ steps.tag.outputs.tag }}
          docker push $IMAGE_URI:latest

      - name: Update web app to new image
        run: |
          az webapp config container set \
            -g $RG -n $APP_SERVICE \
            --docker-custom-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.tag.outputs.tag }} \
            --docker-registry-server-url https://$ACR_NAME.azurecr.io

      - name: Configure application identity policy
        run: |
          DOCINTEL_ENDPOINT=$(az cognitiveservices account show \
            -g $RG -n $DOCINTEL_ACCOUNT --query properties.endpoint -o tsv)
          DOCINTEL_KEY=$(az cognitiveservices account keys list \
            -g $RG -n $DOCINTEL_ACCOUNT --query key1 -o tsv)
          test -n "$DOCINTEL_ENDPOINT"
          test -n "$DOCINTEL_KEY"
          az webapp config appsettings set -g $RG -n $APP_SERVICE \
            --settings \
              AUTH_REQUIRED=true \
              AUTH_ALLOW_LOCAL_DEV=false \
              AUTH_ALLOWED_EMAIL_DOMAINS=shimin.cl \
              AUTH_ADMIN_EMAILS=cristian.reyes@shimin.cl \
              DOCUMENT_INTELLIGENCE_ENDPOINT="$DOCINTEL_ENDPOINT" \
              DOCUMENT_INTELLIGENCE_KEY="$DOCINTEL_KEY" \
            --output none

      - name: Restart web app
        run: az webapp restart -g $RG -n $APP_SERVICE

      - name: Health check
        run: |
          set -e
          HOST=$(az webapp show -g $RG -n $APP_SERVICE --query defaultHostName -o tsv)
          URL="https://$HOST/health"
          EXPECTED_VERSION="${{ steps.tag.outputs.tag }}"
          echo "Waiting for $URL to report version $EXPECTED_VERSION ..."
          for i in $(seq 1 45); do
            response_file=$(mktemp)
            code=$(curl -sS -o "$response_file" -w "%{http_code}" "$URL" || true)
            version=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('version', ''))" "$response_file" 2>/dev/null || true)
            rm -f "$response_file"
            echo "  attempt $i: HTTP ${code:-000}, version ${version:-unknown}"
            [ "$code" = "200" ] && [ "$version" = "$EXPECTED_VERSION" ] && exit 0
            sleep 10
          done
          echo "Health check failed: version $EXPECTED_VERSION never became active" >&2
          exit 1

      - name: Enforce linked Static Web Apps authentication
        run: |
          set -eo pipefail
          # La CLI `az webapp auth update --action` no acepta Return401 aunque
          # authsettingsV2 sí. Actualizamos el recurso ARM completo para conservar
          # el proveedor Static Web Apps enlazado y el resto de su configuración.
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          AUTH_URI="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP_SERVICE/config/authsettingsV2?api-version=2022-03-01"
          AUTH_FILE=$(mktemp)
          az rest --method get --uri "$AUTH_URI" \
            | jq '{properties: (.properties | .platform.enabled = true | .globalValidation.requireAuthentication = true | .globalValidation.unauthenticatedClientAction = "Return401" | .globalValidation.excludedPaths = ["/health"])}' \
            > "$AUTH_FILE"
          az rest --method put --uri "$AUTH_URI" --body "@$AUTH_FILE" --output none
          rm -f "$AUTH_FILE"

          AUTH_STATE=$(az rest --method get --uri "$AUTH_URI" \
            --query "properties.[globalValidation.requireAuthentication,globalValidation.unauthenticatedClientAction,identityProviders.azureStaticWebApps.enabled]" \
            -o tsv)
          echo "App Service auth: $AUTH_STATE"
          echo "$AUTH_STATE" | grep -Eq '^true[[:space:]]+Return401[[:space:]]+true$'

      - name: Security smoke test
        run: |
          set -eo pipefail
          HOST=$(az webapp show -g $RG -n $APP_SERVICE --query defaultHostName -o tsv)
          BACKEND="https://$HOST"
          health_code=$(curl -sS -o /dev/null -w "%{http_code}" "$BACKEND/health")
          api_code=$(curl -sS -o /dev/null -w "%{http_code}" "$BACKEND/api/me")
          echo "health=$health_code anonymous_api=$api_code"
          [ "$health_code" = "200" ]
          [ "$api_code" = "401" ] || [ "$api_code" = "403" ]

      - name: Azure logout
        if: always()
        run: az logout
